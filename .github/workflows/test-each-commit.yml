name: Test Each Commit

on:
  push:

jobs:
  test-each-commit:
    name: Test Each Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          components: rustfmt, clippy

      - name: Install Boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev

      - name: Set bi-weekly cache key
        run: |
          YEAR=$(date +%Y)
          WEEK=$(date +%U)
          BIWEEK=$(( (10#$WEEK + 1) / 2 ))
          echo "CACHE_VERSION=${YEAR}(${BIWEEK})" >> $GITHUB_ENV
        shell: bash

      - name: Restore Rust cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
          key: ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-cargo-

      - name: Configure git identity
        run: |
          git config user.email "ci@ci"
          git config user.name "CI"

      - name: Test each commit individually
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          echo "Push range: $BEFORE_SHA → $HEAD_SHA"

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "New branch push detected — no commit range to iterate, skipping."
            exit 0
          fi

          COMMIT_COUNT=$(git rev-list --count "$BEFORE_SHA..$HEAD_SHA")
          echo "Commits in this push: $COMMIT_COUNT"

          if [ "$COMMIT_COUNT" -le 1 ]; then
            echo "Single commit push — per-commit iteration not needed, skipping."
            exit 0
          fi

          git rebase \
            --exec "bash .github/ci-test-each-commit-exec.sh" \
            "$BEFORE_SHA"